<script id="segdata" type="application/json">
[
 {"title":"片頭：所有權的物權特性","short":"片頭","dur":17,"tr":"zoom","c":"#ff7a59","cap":[
  "歡迎來到公民與社會第5章第二節。",
  "今天來認識「所有權的物權特性」。",
  "什麼是所有權？它有哪些特性？",
  "法律又如何保障與限制它？一起來看！"]},
 {"title":"物與物權","short":"物與物權","dur":28,"tr":"slide","c":"#3fa7f5","cap":[
  "民法以「人」為權利主體，以「物」為權利客體。",
  "權利客體也包括專利權、著作權等精神產物。",
  "物權是對物直接支配、享受利益，並具排他性的權利。",
  "民法上的物，分為不動產和動產。",
  "土地和房子是不動產；手機、衣服、汽機車是動產。",
  "寵物在法律上也是物，屬於動產喔！"]},
 {"title":"一、什麼是所有權","short":"所有權意義","dur":21,"tr":"wipe","c":"#f5a623","cap":[
  "所有權是物權的一種。",
  "所有權人可以自由地使用、收益、處分所有物，",
  "並且排除他人的干涉。",
  "例如自己使用、從中獲得收益，或把它送人、賣掉。",
  "這就是所有權的核心內容。"]},
 {"title":"(一) 為什麼要保障所有權","short":"為何保障","dur":28,"tr":"up","c":"#2bb673","cap":[
  "保障私有財產的所有權，是現代市場經濟制度的核心。",
  "所有權界定清楚，人們就能透過交易滿足彼此需求。",
  "我國憲法第15條規定：人民之財產權，應予保障。",
  "但為了維護公共利益，國家可藉正當程序加以限制，",
  "所以所有權並非受到絕對的保護。"]},
 {"title":"(二) 減少負面影響","short":"公害與社會契約","dur":30,"tr":"blur","c":"#14a3a3","cap":[
  "如果自然資源是無主物，有人為私利排放廢水汙染河川，",
  "全體人民就只能接受環境公害。",
  "從社會契約論來看，國家源於人民讓渡部分權利，",
  "為追求全體利益，自然資源歸於政府的財產，",
  "由政府管理河川，並以法律防止環境公害。",
  "落實所有權的保障與管理，就能避免多數人受害。"]},
 {"title":"(三) 所有權的特性 ①②","short":"四特性(上)","dur":24,"tr":"flip","c":"#8e6cf0","cap":[
  "依據民法，所有權具有四種特性。",
  "第一，直接支配性：不需要他人同意或許可，",
  "就能依自己的意思占有、使用、收益與處分。",
  "第二，保護絕對性：所有權是絕對權，",
  "可以向任何人主張，任何人都不得干涉。"]},
 {"title":"(三) 所有權的特性 ③","short":"四特性(中)","dur":22,"tr":"slideR","c":"#e85d9c","cap":[
  "第三，排他性：一個物品只會有一個所有權，",
  "不會同時存在兩個所有權。",
  "但同一個所有權可以由數人共享，這就是「共有」。",
  "所以小辰可以排除他人對電腦的所有權主張。"]},
 {"title":"(三) 所有權的特性 ④ 優先性","short":"優先性案例","dur":32,"tr":"circle","c":"#ff7a59","cap":[
  "第四，優先性：除法律另有規定外，所有權優先於債權。",
  "小辰原本答應以5千元把電腦賣給元元，",
  "卻反悔賣給出價6千元的阿庭，並把電腦交付給他。",
  "這時阿庭享有電腦的物權，優先於元元的債權。",
  "債權只能對特定人主張，只有相對效力；",
  "物權可以對不特定人主張，屬於絕對權。"]},
 {"title":"(四) 所有權的保障：民法767條","short":"三請求權","dur":30,"tr":"zoom","c":"#3fa7f5","cap":[
  "權利被侵害時，民法第767條提供三種請求權。",
  "一、返還請求權：他人無權占有，可以要求返還。",
  "二、妨害除去請求權：電腦無法開機，可請對方修理好。",
  "三、妨害防止請求權：可預先要求「不可更動電腦設定」。",
  "權利被侵害時，還可以提起訴訟，請求法院救濟。"]},
 {"title":"二、所有權保障的限制","short":"所有權的限制","dur":30,"tr":"slide","c":"#2bb673","cap":[
  "所有權也有限制。第一，物權法定主義：",
  "物權除依法律或習慣外，不得創設。",
  "第二，不動產登記生效主義。",
  "陳太太把房屋賣給林先生，簽約後要到地政事務所，",
  "辦理移轉登記，所有權才正式轉移給林先生。",
  "至於動產，則是交付後才發生物權讓與的效力。"]},
 {"title":"(二) 私有財產與公共利益","short":"公共利益調和","dur":28,"tr":"fade","c":"#f5a623","cap":[
  "私有財產也要和公共利益調和。",
  "例如騎樓：一樓房屋內縮，保留空間讓行人行走。",
  "智慧財產權保障創作者權益，鼓勵創作；",
  "開放原始碼運動則強調資訊自由流通與共享。",
  "法律也保障合理使用，兼顧創作者與公共利益。",
  "智慧財產權，是保障還是限制？想一想！"]},
 {"title":"總結回顧","short":"總結回顧","dur":10,"tr":"zoom","c":"#8e6cf0","cap":[
  "總結：所有權有四特性、三請求權，",
  "既受憲法保障，也受法律限制。下課囉！"]}
]
</script>

  fill=fill||'#fff';const lines=txt.split('|');fs=fs||30;

}

   <text x="${n[0]}" y="${n[1]+42}" font-size="25" font-weight="700" fill="#fff" text-anchor="middle">${n[3]}</text></g>`).join('')}
  <g ${A('pop',.2)}><circle cx="500" cy="500" r="150" fill="#ff7a59" stroke="#fff" stroke-width="10"/><text x="500" y="495" font-size="60" font-weight="900" fill="#fff" text-anchor="middle">所有權</text><text x="500" y="550" font-size="32" font-weight="700" fill="#fff" text-anchor="middle">物權特性</text></g>
 </svg>
 <div class="card a up center" style="--d:6.5s;padding:14px;background:#26223f;color:#fff"><p style="font-size:34px;font-weight:700">下一節：夫妻財產的分配規範與遺產繼承 👋</p></div>
</div>`);

/* ================= Engine ================= */
const N=SEG.length, TOTAL=SEG.reduce((a,s)=>a+s.dur,0);
const START=[];{let acc=0;SEG.forEach(s=>{START.push(acc);acc+=s.dur})}
const spokenLen=s=>s.replace(/[，。、；：！？「」（）()…～,.!?:;\s]/g,'').length;
SEG.forEach(s=>{const lead=0.6,tail=0.9;const w=s.cap.map(c=>spokenLen(c)+2);const sw=w.reduce((a,b)=>a+b,0);
  let acc=0;s.ct=w.map(x=>{const t=lead+(s.dur-lead-tail)*acc/sw;acc+=x;return t});});
const $=id=>document.getElementById(id);
const stage=$('stage'),slidesEl=$('slides');
const slideEls=SL.map((f,i)=>{const d=document.createElement('section');d.className='slide';d.style.setProperty('--bg',['#fff4e0','#eaf6ff','#fff8e6','#effbf3','#e9f8f8','#f4f0ff','#fff0f6','#fff4ec','#eef7ff','#f0fbf4','#fffae6','#f4f0ff'][i]);d.innerHTML=f();slidesEl.appendChild(d);return d;});
// chips & ticks
SEG.forEach((s,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=s.title;b.style.setProperty('--c',s.c);b.onclick=()=>seek(i);$('chips').appendChild(b);
  if(i>0){const t=document.createElement('div');t.className='tick';t.style.left=(START[i]/TOTAL*100)+'%';$('bar').appendChild(t);}});
// transcript
$('transBox').innerHTML=SEG.map((s,i)=>`<div class="seg"><h4>[${fmt(START[i])}] ${i+1}. ${s.title}（${s.dur} 秒）</h4><p>${s.cap.join('')}</p></div>`).join('');
function fmt(x){x=Math.max(0,Math.floor(x));return String(Math.floor(x/60)).padStart(2,'0')+':'+String(x%60).padStart(2,'0')}

let t=0,playing=false,last=performance.now(),cur=-1,curCap=-1,capOn=true,muted=false,voice=null,ended=false;
const synth=window.speechSynthesis||null;
function pickVoice(){if(!synth)return;const vs=synth.getVoices();voice=vs.find(v=>v.lang&&v.lang.replace('_','-').toLowerCase()==='zh-tw')||null;}
if(synth){pickVoice();try{synth.onvoiceschanged=pickVoice}catch(e){}}
function speak(txt){if(!synth||muted||!playing)return;try{const u=new SpeechSynthesisUtterance(txt);u.lang='zh-TW';if(voice)u.voice=voice;u.rate=1.0;u.pitch=1;synth.speak(u);}catch(e){}}
function hush(){if(synth)try{synth.cancel()}catch(e){}}
function segAt(x){let i=0;while(i<N-1&&x>=START[i+1])i++;return i}
function showSlide(i,instant){
  hush();const prev=cur;cur=i;curCap=-1;
  const tr=SEG[i].tr;
  slideEls.forEach((el,k)=>{if(k!==i&&k!==prev){el.className='slide'}});
  if(prev>=0&&prev!==i&&!instant){const p=slideEls[prev];p.className='slide leaving out-'+tr;clearTimeout(p._t);p._t=setTimeout(()=>{if(cur!==prev)p.className='slide'},1150);}
  else if(prev>=0&&prev!==i){slideEls[prev].className='slide'}
  const el=slideEls[i];el.className='slide';void el.offsetWidth;el.className='slide active'+(instant?'':' in-'+tr);
  [...$('chips').children].forEach((b,k)=>{b.className=k===i?'on':(k<i?'done':'')});
  document.querySelector('#cap .who').textContent=(i+1)+'. '+SEG[i].title;
  $('capText').textContent='';
}
function showCap(i,k){const c=$('cap');c.classList.remove('chg');void c.offsetWidth;c.classList.add('chg');$('capText').textContent=k>=0?SEG[i].cap[k]:'';}
function render(){
  const i=segAt(t);if(i!==cur)showSlide(i);
  const lt=t-START[i];let k=-1;SEG[i].ct.forEach((s,j)=>{if(lt>=s)k=j});
  if(k!==curCap){curCap=k;showCap(i,k);if(k>=0)speak(SEG[i].cap[k]);}
  const p=t/TOTAL*100;$('fill').style.width=p+'%';$('knob').style.left=p+'%';
  $('time').textContent=fmt(t)+' / '+fmt(TOTAL);
}
function loop(now){const dt=Math.min(0.25,(now-last)/1000);last=now;
  if(playing){t+=dt;if(t>=TOTAL){t=TOTAL;finish();}}
  render();requestAnimationFrame(loop);}
function setPlay(p){playing=p;stage.classList.toggle('paused',!p);$('bPlay').textContent=p?'❚❚':'▶';
  if(!p)hush();else if(curCap>=0)speak(SEG[cur].cap[curCap]);}
function finish(){playing=false;stage.classList.add('paused');$('bPlay').textContent='▶';hush();ended=true;$('endOv').hidden=false;}
function seek(i){i=Math.max(0,Math.min(N-1,i));t=START[i]+0.001;ended=false;$('endOv').hidden=true;showSlide(i);curCap=-1;if(!playing&&$('startOv').hidden)setPlay(true);render();}
$('bStart').onclick=()=>{$('startOv').hidden=true;pickVoice();t=0;cur=-1;setPlay(true);render();};
$('bReplay').onclick=()=>{$('endOv').hidden=true;ended=false;t=0;cur=-1;setPlay(true);};
$('bPlay').onclick=()=>{if(ended){$('bReplay').onclick();return}setPlay(!playing)};
$('bPrev').onclick=()=>seek(cur-1);
$('bNext').onclick=()=>seek(cur+1);
$('bCap').onclick=()=>{capOn=!capOn;$('cap').style.visibility=capOn?'visible':'hidden';$('bCap').classList.toggle('off',!capOn)};
$('bMute').onclick=()=>{muted=!muted;$('bMute').textContent=muted?'🔇':'🔊';$('bMute').classList.toggle('off',muted);if(muted)hush();else if(playing&&curCap>=0)speak(SEG[cur].cap[curCap]);};
$('bTrans').onclick=()=>{$('trans').hidden=false};
$('bClose').onclick=()=>{$('trans').hidden=true};
$('bar').onclick=e=>{const r=$('bar').getBoundingClientRect();const x=(e.clientX-r.left)/r.width*TOTAL;seek(segAt(x));};
document.addEventListener('keydown',e=>{
  if(!$('startOv').hidden){if(e.code==='Space'||e.key==='Enter'){e.preventDefault();$('bStart').click()}return}
  if(e.code==='Space'){e.preventDefault();$('bPlay').click()}
  else if(e.key==='ArrowRight'){e.preventDefault();seek(cur+1)}
  else if(e.key==='ArrowLeft'){e.preventDefault();seek(cur-1)}
  else if(e.key==='Escape'){$('trans').hidden=true}
});
function fit(){const W=innerWidth,H=innerHeight,s=Math.min(W/1080,H/1920);stage.style.transform=`translate(${(W-1080*s)/2}px,${(H-1920*s)/2}px) scale(${s})`;}
addEventListener('resize',fit);fit();
window.__video={SEG,TOTAL,START,get t(){return t},seek,get cur(){return cur}};
showSlide(0,true);stage.classList.add('paused');render();requestAnimationFrame(loop);
</script>
</body>
</html>
